[package]
name = "ophois"
version = "0.4.0"
authors = ["ethicnology <ethicnology@pm.me>"]
edition = "2024"
description = "Ophoïs, the opener of the ways, creates streets graph from OpenStreetMap"
readme = "README.md"
repository = "https://github.com/ethicnology/ophois"
license = "GPL-3.0-or-later"
keywords = ["OpenStreetMap", "OSM", "graph", "streets", "network", "map", "highway", "way"]
categories = ["command-line-utilities"]


[dependencies]
reqwest = { version = "0.13" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = [ "derive" ] }
quick-xml = { version = "0.40", features = [ "serialize" ] }
rand = "0.10"
